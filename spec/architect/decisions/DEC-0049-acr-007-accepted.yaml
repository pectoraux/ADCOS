  - "Experience records inform Architect reasoning but cannot directly amend architecture or authorize implementation."
  - "Accepted architectural changes must preserve mission consistency, preserve historical provenance, and include discriminating verification where semantics change."
  - "Chat history has no authority and cannot be the sole surviving record of an architectural decision."
