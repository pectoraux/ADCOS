findings:
  - "ACR-006 is accepted as a reusable architectural design contract arising from the W035/W040 physical-validation lessons."
  - "Authoritative snapshots remain the state representation, while ordered platform events become the preferred change-notification mechanism where the platform provides them."
  - "Recovery is journal-first: immutable configuration plus append-only journal plus compact checkpoint, followed by reconciliation with a fresh authoritative platform observation."
  - "Android background execution is an external constraint and is not a protocol guarantee; control-plane path changes are distinct from data-plane traffic."
  - "No new persistence, session, routing, transport, identity, or policy authority is created by this acceptance."
