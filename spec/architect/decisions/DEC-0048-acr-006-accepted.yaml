findings:
  - "ACR-006 is accepted as a reusable architectural design contract for event-driven platform integration and journal-first recovery."
  - "Platform changes should be represented as authoritative events with associated observations/snapshots rather than relying exclusively on polling."
  - "Recovery reconstructs durable protocol state from journal and checkpoint state and reconciles with current platform observations."
  - "Android/background execution is treated as an unreliable execution environment; durable protocol state is not dependent on a continuously running process."
  - "No second session, routing, identity, transport, or policy authority is created by this acceptance."
