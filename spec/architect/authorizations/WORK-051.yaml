  - "mutating connectivity/session/path/routing/transport authorities or their semantics"
  - "moving payment movement or provider rails inside ADCOS (payment providers remain responsible for payment authorization, rails, and regulated funds movement behind an explicit boundary)"
  - "payment-provider-specific assumptions leaking into the core"
  - "treating reservation or payment success as delivery evidence"
  - "rewriting historical delivery or commercial facts (corrections are append-only compensating records)"
  - "private authority access (and private-method fallbacks for lifecycle or evidence)"
  - "synthetic physical evidence presented as physical PASS"
  - "wire-schema changes unless separately authorized"
  - "modifying frozen spec semantics"

