acceptance_criteria:
  - "Usage is derived only from authoritative delivered-traffic evidence; payment capture and reservation/lease state never create usage."
  - "Usage history is append-only, immutable, deterministic, and idempotent, with explicit handling of duplicate, delayed, and out-of-order observations."
  - "Each billable usage fact is correlated to an authorized delivery/path evidence record; fabricated, unknown, stale, or unauthorized evidence fails closed."
  - "Billable finality is explicit and immutable; refunds, reversals, and disputes are compensating records and never rewrite historical delivery observations."
  - "UsageLedger references existing authorities through public interfaces only and cannot mutate or shadow connectivity, session, path, routing, or transport authorities; provider/payment observations remain data only."
