  - "new identity, session, routing, path, transport, federation, or policy authority"
  - "mutation or private-method access into existing connectivity/session/path/routing/transport authorities"
  - "treating payment/reservation/provider observations as delivery evidence"
  - "rewriting historical usage or delivery facts"
  - "wire-schema changes unless separately authorized"
  - "modifying frozen architecture semantics"
