# ADCOS Work Item authorization record — WORK-052 active implementation.
#
# WORK-052-CORE-001 is the Architect's repository-local authorization for
# UsageLedger. It is activated atomically with DEC-0059, which accepts
# WORK-051 and supersedes WORK-051-CORE-001. This record is the sole durable
# authority for W052 implementation scope.
#
# W052 derives billable usage ONLY from authoritative delivered-traffic
# evidence. It records usage observations, correlates them to authorized
# delivery/path evidence, establishes explicit billable finality, performs
# deterministic reconciliation, and records compensating refunds/reversals/
# disputes. It references — never owns or mutates — existing connectivity,
# session, NetworkPath, delivery-evidence, and W051 commercial authorities.
#
# Payment capture, reservation/lease state, provider observations, and
# payment-provider APIs are never delivery proof. W052 does not authorize
# W053 or W044-W050, and does not modify frozen architecture semantics,
# protocol wire schemas, or physical evidence obligations.
#
# schema: spec/architect/authorizations/ (v1); verified by tools/spec_check.py (ARCH-03).

work_item: WORK-052
status: active
authorized: true
type: implementation
authorization_id: "WORK-052-CORE-001"
authorization_decision: DEC-0059
baseline_sha: fc3ace9c45b77bae36fe757a5629bc197fd906e4
