          # --- W044 implementation handoff for Z.ai.
          w044_handoff = '''# WORK-044 Architect Handoff — Payment Provider Adapters & Settlement Gateway

**Authorization:** WORK-044-CORE-001  
**Decision:** DEC-0062  
**Baseline:** c9a1f8589cddbbeb21756bdd8f72ed57ea515173  
**Implementer:** Z.ai

## Objective

Implement the provider-neutral payment boundary for the ADCOS commercial control plane. ADCOS owns the canonical commercial state, correlation, reconciliation, refund/dispute state, payout state, and capability declarations; external regulated providers own payment-rail execution and regulated funds movement.

## Required invariants

1. Payment-provider operations never create usage, delivery evidence, billable-final facts, or allocation facts.
2. Canonical ADCOS state is provider-neutral; provider-specific API semantics stay inside adapter implementations.
3. Payment-provider references are idempotently correlated to canonical transaction/allocation identities.
4. Authorization, capture, refund, reversal, payout, and normalized failure outcomes are explicit and replay-safe.
5. Provider callbacks/webhooks are external observations until reconciled against canonical ADCOS state.
6. Duplicate, replayed, conflicting, and out-of-order callbacks fail closed or converge deterministically without double application.
7. Settled commercial history is immutable; corrections are append-only compensating records.
8. Provider/ADCOS divergence is observable and reconcilable without rewriting prior truth.
9. Provider capability limitations are explicit, versioned, and cannot be silently inferred as universally supported.
10. Payment adapters cannot import or mutate identity, session, NetworkPath, routing, transport, packet, or delivery-evidence authorities.
11. ADCOS must not custody or directly move regulated funds in W044; regulated KYC/KYB/custody/MOR obligations remain provider/jurisdiction responsibilities represented as capability/eligibility inputs.
12. Restart/replay and hash-seed runs reproduce the same canonical payment-state and journal digest streams.

## Consumption boundary

W044 consumes accepted W051/W052/W053 facts through public interfaces only. In particular, payout/transfer instructions must originate only from finalized W053 allocations, and any payment observation must remain DATA until reconciled. The provider layer must never become a shadow UsageLedger, EconomicAllocation, connectivity, session, or routing authority.

## Scope

Implement only the W044 payment-provider adapter family required by issue #88, with a deterministic fake/sandbox provider, dedicated self-test, evidence/handoff documentation, and additive CI wiring. Keep provider-specific credentials, webhook signatures, external IDs, failure codes, and API semantics inside adapters. No live payment account onboarding or real-money movement is part of this Work Item.

## Verification

The delivery PR must demonstrate deterministic intent/retrieval, authorization/capture/refund/reversal, payout instruction emission from finalized allocations, provider failure normalization, capability declaration/versioning, callback signature/anti-replay boundaries, duplicate/conflict/out-of-order callback handling, divergence reconciliation, append-only compensation, negative payment->usage/allocation cases, forbidden-import tests, restart/replay determinism, and exact W044 authorization provenance.

The delivery PR must not modify `spec/architect/` and must remain within `WORK-044-CORE-001`. Any required architecture or authorization change is a separate Architect governance action.

## Acceptance

One implementation PR only. The Architect reviews the exact delivery SHA, evidence manifest, scope audit, CI/provenance, authority boundaries, replay/failure behavior, and every invariant above before acceptance. W045 and later Work Items remain unauthorized until a subsequent governance transition activates them.
'''
