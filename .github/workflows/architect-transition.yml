        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist DEC-0062 W053 acceptance and W044 activation
        env:
          TARGET_BRANCH: governance/w053-accept-w044
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          DECISION_TS = "2026-09-02T03:26:32Z"
          MAIN_SHA = "c9a1f8589cddbbeb21756bdd8f72ed57ea515173"
          W053_BASE = "9e77861586b19303a4e46558ebed172c82399595"
          W053_HEAD = "43591667b226b6239e8197816514b679af1e6154"
          W053_MERGE = MAIN_SHA

