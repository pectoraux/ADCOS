name: Architect ledger reconciliation (one-shot)

on:
  push:
    branches:
      - governance/w052-w053-activation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile branch with current main and transition W052 ledger
        env:
          EXPECTED_MAIN_SHA: cdd2a9c011f573ba11a7bb39e7dc178e7f150b54
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

          git merge --no-edit -X ours origin/main

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("spec/architect/execution-ledger.yaml")
          s = p.read_text()

          old_main = "fe6e6e35a49cb2113315d0ec1569f7e93a3cf200"
          new_main = "cdd2a9c011f573ba11a7bb39e7dc178e7f150b54"
          assert f"main_sha: {old_main}" in s, "unexpected ledger snapshot baseline"
          s = s.replace(f"main_sha: {old_main}", f"main_sha: {new_main}", 1)
          s = s.replace('last_updated: "2026-09-01"', 'last_updated: "2026-09-02"', 1)

          w052 = re.compile(r'  - work_item: WORK-052\n.*?(?=  - work_item: WORK-053\n)', re.S)
          replacement = '''  - work_item: WORK-052
    title: "UsageLedger: delivered-usage metering, billable finality, and append-only reconciliation"
    phase: 10
    branch: "work-052-usage-ledger"
    baseline_sha: fc3ace9c45b77bae36fe757a5629bc197fd906e4
    pr: 121
    pr_head: a0d3b895831d00c2a5fe267afe9c118a5c010648
    reviewed_sha: a0d3b895831d00c2a5fe267afe9c118a5c010648
    merge_sha: dad68cc5c7ecc48eedddfa26264a8b38f7fe84fa
    merged_at: 2026-09-01T15:19:03Z
    ci_run: null
    review_rounds: 1
    acceptance_decision: DEC-0060
    correction_decisions: []
    handoff: docs/WORK-052-handoff.md
    handoff_required: true
    lifecycle: accepted-merged
    note: "delivery accepted by DEC-0060 on the exact reviewed head a0d3b895 after the review-response cycle: the twelve UsageLedger invariants are satisfied by the recorded 42/42 battery, determinism proofs, provenance review, and SOFTWARE-only evidence. PR #121 merged at dad68cc5; W040 physical obligations remain independent and open. The acceptance transition supersedes WORK-052-CORE-001 and activates WORK-053-CORE-001 as the sole active implementation authorization; this ledger entry is the durable fact that makes WORK-053's hard dependency WORK-052 satisfied."
'''
          s, n = w052.subn(replacement, s, count=1)
          assert n == 1, "WORK-052 block not found exactly once"

          marker = "reconciliations:\n"
          assert marker in s
          recon = '''  - reconciliation_id: LEDGER-RECON-008
    recorded_by: DEC-0060
    recorded_at: 2026-09-02T00:00:00Z
    from_main_sha: fe6e6e35a49cb2113315d0ec1569f7e93a3cf200
    to_main_sha: cdd2a9c011f573ba11a7bb39e7dc178e7f150b54
    reason: "W052 acceptance -> W053 activation reconciliation: main advanced through the accepted W052 delivery (PR #121, merged dad68cc5) and the subsequent commercial-execution charter alignment (DEC-0061). DEC-0060 durably records acceptance of W052 and activation of WORK-053-CORE-001; this reconciliation moves the execution-ledger snapshot from the prior W042/W051 transition baseline to the current mainline and records the real W052 delivery in the authoritative ledger."
    history: "No prior work-item history is rewritten: WORK-001..WORK-041, WORK-040's independent physical obligations, and the registered-only W044..W051/W053 entries remain otherwise unchanged. WORK-052 is the sole transitioned delivery entry, from registered to accepted-merged, with its exact reviewed head, merge SHA, and DEC-0060 acceptance. The active W053 authorization and execution-state transition remain governed by DEC-0060; this reconciliation only makes the ledger's historical delivery fact and snapshot baseline consistent with that already-persisted governance transition."

'''
          s = s.replace(marker, recon + marker, 1)
          p.write_text(s)
          PY

          git add spec/architect/execution-ledger.yaml
          git commit -m "governance: reconcile W052 acceptance and W053 activation ledger"
          git push origin HEAD

          git rm .github/workflows/architect-ledger-reconcile-once.yml
          git commit -m "chore: remove one-shot governance reconciliation workflow"
          git push origin HEAD
