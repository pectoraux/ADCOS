name: one-shot-finalize-w047-governance
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize W047 governance baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          NEW = '825f48f814926223665c1761beaba6cbdd2c2640'
          old = 'f45be6dd0544a2fd6cbc910805def28bbe0c71eb'

          p = Path('spec/architect/execution-ledger.yaml')
          t = p.read_text()
          # Update only the WORK-047 entry's baseline_sha.
          m = re.search(r'(?ms)(- work_item: WORK-047\n.*?\n    baseline_sha:) ([0-9a-f]{40})(\n)', t)
          if not m:
              raise SystemExit('WORK-047 ledger entry not found')
          if m.group(2) not in {old, NEW}:
              raise SystemExit('WORK-047 ledger baseline is unexpected: ' + m.group(2))
          if m.group(2) == old:
              t = t[:m.start(2)] + NEW + t[m.end(2):]

          if 'reconciliation_id: LEDGER-RECON-015' not in t:
              rec = (
                  '\n  - reconciliation_id: LEDGER-RECON-015\n'
                  '    recorded_by: DEC-0068\n'
                  '    recorded_at: 2026-09-02T20:14:05Z\n'
                  f'    from_main_sha: 3db7500d7b79a8cd3e3a651e1461fbb320efd67e3\n'
                  f'    to_main_sha: {NEW}\n'
                  '    reason: "Baseline-advancement-only reconciliation completing DEC-0067: PR #133 merged the W046 acceptance/W047 activation governance transition at e3b2c484; PR #134 merged the reconciliation transition at 825f48f. The persistent Architect snapshot and WORK-047 authorization baseline are aligned to the exact post-transition mainline 825f48f. No work-item contract, acceptance fact, dependency, or frozen architecture/protocol semantic changes."\n'
                  '    history: "No work-item history rewritten. W046 remains accepted-merged at reviewed head 09960ea with implementation merge f45be6d; W047 remains implementation-empty and the sole active authorization; W040 remains independent and unaccepted with its physical obligations open; W048-W050 remain unauthorized."\n'
              )
              if not t.rstrip().endswith('reconciliations:') and '\nreconciliations:' not in t:
                  raise SystemExit('reconciliations section not found')
              t = t.rstrip() + rec + '\n'
          p.write_text(t)

          p = Path('spec/architect/decisions/README.md')
          t = p.read_text()
          old_row = '| DEC-0068 | acceptance | WORK-047 | ACCEPTED | ACCEPTED | W046 acceptance baseline reconciliation / W047 active baseline |'
          new_row = '| DEC-0068 | governance | WORK-047 | ACCEPTED | ACCEPTED | W046 acceptance baseline reconciliation / W047 active baseline |'
          if old_row in t:
              t = t.replace(old_row, new_row, 1)
          elif new_row not in t:
              raise SystemExit('DEC-0068 registry row not found')
          p.write_text(t)

          wf = Path('.github/workflows/_once_finalize_w047_governance.yml')
          wf.unlink()
          PY
          git config user.name 'Architect (pectoraux)'
          git config user.email 'architect@adc.os'
          git add spec/architect
          git add -u .github/workflows/_once_finalize_w047_governance.yml || true
          git commit -m 'Governance: finalize W047 baseline and registry' || exit 0
          git push origin main
