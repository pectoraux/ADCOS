name: R1 ledger reconcile once
on:
  push:
    branches:
      - governance/r1-live-main-projection-20260905
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/governance/r1-live-main-projection-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          live = Path('spec/architect/execution-ledger.yaml')
          text = live.read_text()
          accepted = subprocess.check_output([
              'git','show','origin/refs/heads/governance/w050-baseline-reconciliation:spec/architect/execution-ledger.yaml'
          ], text=True)
          def extract(src, start, end):
              a = src.index(start)
              b = src.index(end, a)
              return src[a:b]
          cur_start = text.index('  - work_item: WORK-044\n')
          cur_end = text.index('reconciliations:\n', cur_start)
          accepted_start = accepted.index('  - work_item: WORK-044\n')
          accepted_end = accepted.index('  - work_item: WORK-051\n', accepted_start)
          accepted_044_049 = accepted[accepted_start:accepted_end]
          current_w050_start = text.index('  - work_item: WORK-050\n', cur_start)
          current_w051_start = text.index('  - work_item: WORK-051\n', current_w050_start)
          current_w050 = text[current_w050_start:current_w051_start]
          current_w050 = current_w050.replace('    lifecycle: registered\n', '    lifecycle: accepted-merged\n', 1)
          current_w050 = current_w050.replace('    acceptance_decision: null\n', '    acceptance_decision: DEC-0083\n', 1)
          current_w050 = current_w050.replace('    note: "registered-only entry added by ACR-011:', '    note: "accepted by DEC-0083 from the historical WORK-050-CORE-001 delivery package and exact final W050.4 head 815f4febbc64d55d3576386e65adaa6244c4f7cb; the permanent 76/76 battery, authority/import audits, replay/restoration integrity, hash-seed determinism, fresh-world/order independence, and SOFTWARE/PHYSICAL separation were re-reviewed by the Architect. Original registration/activation provenance is preserved after this prefix:', 1)
          current_w051_053 = text[current_w051_start:cur_end]
          new_work_items = accepted_044_049 + current_w050 + current_w051_053
          text = text[:cur_start] + new_work_items + text[cur_end:]
          text = re.sub(r'(?m)^main_sha: .*$', 'main_sha: 338af793923e1267ff3523de4310be273d75a2cd', text, count=1)
          recon = '''\n  - reconciliation_id: LEDGER-RECON-024\n    recorded_by: DEC-0083\n    recorded_at: 2026-09-05T16:00:00Z\n    from_main_sha: 7fb47bb312708d06f3b3c1ba0496104362c7d135\n    to_main_sha: 338af793923e1267ff3523de4310be273d75a2cd\n    reason: "R1 lifecycle normalization: reconcile the current W044-W049 registered-only projections to their exact repository-native accepted delivery facts (DEC-0064, DEC-0065, DEC-0067, DEC-0070, DEC-0075, DEC-0078), record W050 retrospective acceptance under DEC-0083, and advance the ledger snapshot to the exact canonical mainline."\n    history: "No historical Git commit or prior reconciliation is rewritten. W044-W049 lifecycle fields are normalized only to already-established accepted delivery facts recovered from the repository's durable accepted ledger lineage; W050 gains a discrete DEC-0083 acceptance record while retaining its original registration/activation provenance. WORK-001-W043 and WORK-051-W053 remain unchanged. No implementation, architecture, protocol, or physical-evidence state is changed by this reconciliation."\n'''
          if 'LEDGER-RECON-024' in text:
              raise SystemExit('LEDGER-RECON-024 already present')
          text = text.rstrip() + recon
          live.write_text(text)
          PY
          git config user.name 'pectoraux'
          git config user.email 'ekontete@gmail.com'
          git add spec/architect/execution-ledger.yaml
          git rm -f .github/workflows/r1-ledger-reconcile-once.yml
          git commit -m 'governance: reconcile R1 lifecycle ledger and close W050 provenance'
          git push origin HEAD
