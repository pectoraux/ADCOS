name: spec-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  specification-consistency:
    name: Specification consistency checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Uses the runner's preinstalled Python 3 (all tools require only the
      # standard library and run fully offline — no package installation,
      # no network access, no external services).
      - name: Run specification consistency checks
        run: python3 tools/spec_check.py

      - name: Run specification checker negative tests
        run: python3 tools/spec_check_selftest.py

      - name: Run schema/registry consistency checks
        run: python3 tools/schema_check.py

      - name: Run schema/registry compatibility tests
        run: python3 tools/schema_selftest.py

      - name: Run envelope/serialization tests
        run: python3 tools/envelope_selftest.py

      - name: Run identity lifecycle/security tests
        run: python3 tools/identity_selftest.py

      - name: Run capability statement/negotiation tests
        run: python3 tools/capability_selftest.py

      - name: Run peer discovery tests
        run: python3 tools/discovery_selftest.py

      - name: Run evidence-aware topology tests
        run: python3 tools/topology_selftest.py

      - name: Run resource model/measurement tests
        run: python3 tools/resource_selftest.py

      - name: Run intent/QoS normalization tests
        run: python3 tools/intent_selftest.py

      - name: Run policy engine tests
        run: python3 tools/policy_selftest.py

      - name: Run path computation/routing tests
        run: python3 tools/routing_selftest.py

      - name: Run session lifecycle tests
        run: python3 tools/session_selftest.py

      - name: Run multipath session semantics tests
        run: python3 tools/multipath_selftest.py

      - name: Run mobility and handover tests
        run: python3 tools/mobility_selftest.py

      - name: Run federation protocol tests
        run: python3 tools/federation_selftest.py

      - name: Run adapter SDK/runtime tests
        run: python3 tools/adapter_selftest.py

      - name: Run secure transport profile tests
        run: python3 tools/transport_selftest.py

      - name: Run IP integration boundary tests
        run: python3 tools/ipintegration_selftest.py

      - name: Run 5G Core integration boundary tests
        run: python3 tools/fivegc_selftest.py

      - name: Run Wi-Fi/non-3GPP access adapter tests
        run: python3 tools/wifi_selftest.py

      - name: Run backhaul adapter family tests
        run: python3 tools/backhaul_selftest.py

      - name: Run mesh/relay adapter family tests
        run: python3 tools/mesh_selftest.py

      - name: Run distributed-core adapter family tests
        run: python3 tools/distcore_selftest.py
      - name: Run service registry/edge compute tests
        run: python3 tools/service_selftest.py

      - name: Run telemetry/observability tests
        run: python3 tools/telemetry_selftest.py
