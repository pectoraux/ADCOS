name: one-shot-reconcile-w046
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile persistent Architect baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          NEW='825f48f814926223665c1761beaba6cbdd2c2640'
          p=root/'spec/architect/execution-ledger.yaml'
          t=p.read_text()
          matches=list(re.finditer(r'(?m)^main_sha:\s*[0-9a-f]{40}$',t))
          if len(matches)!=1: raise SystemExit(f'expected exactly one top-level ledger main_sha, found {len(matches)}')
          t=t[:matches[0].start()]+'main_sha: '+NEW+t[matches[0].end():]
          if 'reconciliation_id: LEDGER-RECON-015' not in t:
              t=t.rstrip()+'\n\n  - reconciliation_id: LEDGER-RECON-015\n    recorded_by: DEC-0068\n    recorded_at: 2026-09-02T20:14:05Z\n    from_main_sha: 3db7500d7b79a8cd3e3a651e1461fbb320efd67e3\n    to_main_sha: 825f48f814926223665c1761beaba6cbdd2c2640\n    reason: "Baseline-advancement-only reconciliation completing DEC-0067: PR #133 merged the W046 acceptance/W047 activation governance transition at e3b2c484; PR #134 merged the baseline reconciliation at 825f48f. The persistent Architect snapshot advances from 3db7500 to 825f48f, and WORK-047 authorization provenance is aligned to the same exact post-transition governance mainline by DEC-0068."\n    history: "No work-item history rewritten. W046 remains accepted-merged at reviewed head 09960ea with implementation merge f45be6d; W047 remains implementation-empty and the sole active authorization; W040 remains independent and unaccepted with its physical obligations open; W048-W050 remain unauthorized."\n'
          p.write_text(t+'\n' if not t.endswith('\n') else t)

          p=root/'spec/architect/execution-state.yaml'
          t=p.read_text()
          old=re.search(r'(?m)^  main_sha:\s*[0-9a-f]{40}$',t)
          if not old: raise SystemExit('execution-state main_sha not found')
          t=t[:old.start()]+'  main_sha: '+NEW+t[old.end():]
          t=re.sub(r'(?m)^  main_sha_semantics:.*$', '  main_sha_semantics: "Exact post-DEC-0067 governance mainline: PR #133 merged W046 acceptance/W047 activation; PR #134 merged the baseline reconciliation at 825f48f; DEC-0068 / LEDGER-RECON-015 record this exact mainline as the persistent baseline."', t, count=1)
          t=re.sub(r'(?m)^  halted_reason:.*$', '  halted_reason: "W047 is active-authorized from the exact reconciled mainline 825f48f; Z.ai may implement from this exact mainline."', t, count=1)
          p.write_text(t.rstrip()+'\n')

          p=root/'spec/architect/current-state.md'
          t=p.read_text()
          t=re.sub(r'(?m)^- Baseline: `[^`]+`.*$', '- Baseline: `825f48f814926223665c1761beaba6cbdd2c2640` (exact post-DEC-0067 W046 acceptance/W047 activation governance mainline; reconciled by DEC-0068 / LEDGER-RECON-015)', t, count=1)
          t=t.replace('The persistent snapshot remains at the pre-transition governance baseline until this governance PR merges, following the established baseline-reconciliation convention.','The persistent snapshot is reconciled to the exact post-transition governance mainline by DEC-0068 / LEDGER-RECON-015, following the established baseline-reconciliation convention.',1)
          p.write_text(t.rstrip()+'\n')

          Path('.github/workflows/_once_reconcile_w046.yml').unlink()
          PY
          git config user.name 'Architect (pectoraux)'
          git config user.email 'architect@adc.os'
          git add spec/architect
          git add -u .github/workflows/_once_reconcile_w046.yml || true
          git commit -m 'Governance: finalize W046 baseline reconciliation'
          git push origin main
